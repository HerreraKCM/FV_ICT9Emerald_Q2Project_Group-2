<header>
  <div class="header">
    <h1 class="text-center text-dark"> <img src="https://scontent.fmnl25-5.fna.fbcdn.net/v/t1.15752-9/911849338_1191769976526917_1332763677667157267_n.png?stp=dst-png_s960x960&_nc_cat=110&_nc_map=urlgen_bucketless&ccb=1-7&_nc_sid=9f807c&_nc_ohc=tUVYze-iRv0Q7kNvwGIsKsr&_nc_oc=AdqF8LNYRL-46dBeNIGjn2Tt_ynGd93u9kTEH9JRjEDiZrPg21z34keNeUg-hCCHXFQ&_nc_ad=z-m&_nc_cid=0&_nc_zt=23&_nc_ht=scontent.fmnl25-5.fna&_nc_ss=7a22e&oh=03_Q7cD6wFA-d0mKaEfSiVxtXpzt56jqIk7oIs4ecDgTsh0-Msaag&oe=6B24E7A0" alt="OBMC Logo">OBMC Student Enrollment Form </h1>
    <p class="text-muted">Fill out the form below to enroll for the upcoming school year.</p>
</div>

<div class="container" id="enroll">
    <div class="form-container" style="box-shadow: 5px 5px 10px rgba(16, 0, 0, 0.5);background: #c6d3e9a1;">
        <form>

            <div class="form-section">
                <h5>Information</h5>
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Campus</label>
                        <select class="form-select" name="campus" id="campus" required>
                            <option value="">Select...</option>
                            <option value="fv">Fairview</option>
                            <option value="gh">Greenhills</option>
                            <option value="sa">Sta. Ana</option>
                            <option value="ag">Angeles</option>
                            <option value="lp">Las Piñas</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Enrollment Type</label>
                        <select class="form-select required">
                            <option value="">Select...</option>
                            <option value="new">New Student</option>
                            <option value="returning">Returning Student</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">School Year</label>
                        <input type="text" class="form-control" placeholder="2026-2027" required>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h5>Student Information</h5>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">First Name</label>
                        <input type="name" class="form-control" id="firstname" name="firstname" placeholder="John" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Last Name</label>
                        <input type="name" class="form-control" id="lastname" name="lastname" placeholder="Doe" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Birth Date</label>
                        <input type="date" class="form-control" id="birthdate" name="birthdate" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Gender</label>
                        <select class="form-select" id="gender" name="gender" required>
                            <option value="">Select...</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Grade Level</label>
                        <select class="form-select" id="gradelevel" name="gradelevel" required>
                            <option value="">Select...</option>
                            <option value="casa">Casa</option>
                            <option value="primary">Primary</option>
                            <option value="junior">Junior High</option>
                            <option value="senior">Senior High</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h5>Contact Details</h5>

                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" placeholder="johndoe@example.com" id="email" name="email" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Contact Number</label>
                    <input type="tel" class="form-control" placeholder="0912-345-6789" id="contact" name="contact" required>
                </div>
            </div>

            <div class="form-section">
                <h5>Other Information</h5>

                <label class="form-label">Mode of Learning</label>

                <div class="form-check">
                    <input type="radio" class="form-check-input" name="learning" value="online" required>
                    <label class="form-check-label">Online</label>
                </div>

                <div class="form-check mb-3">
                    <input type="radio" class="form-check-input" name="learning" value="face-to-face" required>
                    <label class="form-check-label">Face-to-face</label>
                </div>

                <div class="d-flex justify-content-center">
                <div class="form-check mb-4">
                    <input type="checkbox" class="form-check-input">
                    <label class="form-check-label"> I agree to the terms and conditions.</label>
                </div>
                </div>
            </div>

            <div class="text-center">
              <button type="button" class="submit-btn" onclick="window.location.href='success.html'">Submit Enrollment</button>
            </div>
        </form>
    </div>
